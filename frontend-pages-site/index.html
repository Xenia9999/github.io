<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Frontend Site</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <style>
    :root { color-scheme: light dark; --bg:#ffffff; --fg:#1d1d1f; --muted:#6e6e73; --accent:#0071e3; --card:#f5f5f7; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0d0d0d; --fg:#ffffff; --muted:#b3b3b3; --accent:#0a84ff; --card:#1a1a1a; } }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    .wrap { max-width: 800px; margin: 0 auto; padding: 2rem; }
    .card { background: var(--card); border-radius: 12px; padding: 1.5rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .btn { display: inline-block; padding: .75rem 1rem; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; }
    .btn:focus { outline: 2px solid currentColor; outline-offset: 2px; }
    .muted { color: var(--muted); }
    header { margin-bottom: 1.25rem; }
    footer { margin-top: 2rem; font-size: .9rem; }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Frontend Site</h1>
      <p class="muted">Secure static site for GitHub Pages (project repo).</p>
    </header>
    <section class="card" aria-labelledby="about">
      <h2 id="about">About</h2>
      <p>This repository contains only public static files. No secrets or backend code.</p>
    </section>
    <section class="card" aria-labelledby="links">
      <h2 id="links">Links</h2>
      <p class="muted">Add project links here.</p>
    </section>
    <footer class="muted">
      <p>© 2025</p>
    </footer>
  </main>
</body>
</html>
